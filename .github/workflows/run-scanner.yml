- name: Override config từ input
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          sed -i "s/^MESSAGE_SCAN_LIMIT = .*/MESSAGE_SCAN_LIMIT = ${{ inputs.scan_limit }}/" jio_gemini_share.py
          sed -i "s/^OTP_TIMEOUT = .*/OTP_TIMEOUT = ${{ inputs.otp_timeout }}/" jio_gemini_share.py
          echo "--- Config sau override ---"
          grep -E "^(MESSAGE_SCAN_LIMIT|OTP_TIMEOUT)" jio_gemini_share.py
